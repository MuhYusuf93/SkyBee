name: kasir_app
description: Kasir offline Android, persediaan, dan piutang untuk satu perangkat toko.
publish_to: none
version: 0.5.0+7

environment:
  sdk: ^3.12.2
  flutter: '>=3.44.7'

dependencies:
  kasir_platform:
    path: packages/kasir_platform
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  sqflite: ^2.4.4+1
  path: ^1.9.1
  uuid: ^4.6.0
  cryptography: ^2.9.0
  timezone: ^0.11.1
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  sqflite_sqlcipher: 3.4.1
  flutter_local_notifications: 22.3.2
  google_sign_in: 7.2.0
  workmanager: 0.10.10
  http: 1.6.0
  google_sign_in_platform_interface: 3.1.0
  crypto: 3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/third_party/
